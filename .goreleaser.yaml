version: 2

project_name: spectackle

builds:
  - id: spectackle
    main: ./cmd/spectackle
    binary: spectackle
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/jxsl13/spectackle/internal/mcpserver.Version={{.Version}}

archives:
  - id: spectackle
    ids:
      - spectackle
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^spec:"
      - "^chore:"
