name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is the finalization trigger: the server flips a task's
    # pull request out of draft at done, and THAT is when the one real CI run
    # belongs. synchronize/opened stay listed so draft pushes still produce a
    # (skipped) run record, keeping the check history continuous.
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  build:
    runs-on: ubuntu-latest
    # Draft pull requests never consume a runner: work in progress is gated
    # LOCALLY (the workspace verify commands run at done, before the ready
    # flip), and the runner fires once, at finalization. This condition is
    # what turns the draft-while-working / ready-at-done mapping into the CI
    # minimization — measured before: three runs per task branch where one
    # suffices.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: coverage (M5 gate)
        run: make cover

      - name: fuzz (M4 linter hardening)
        # Push runs only: fuzzing is exploratory and nondeterministic, and its
        # wind-down race red-blocked a mechanical merge on a slow runner
        # (B-01KYDP). The pull_request gate stays deterministic — build, vet,
        # race tests — so a mechanical merge can never be refused by noise; a
        # fuzz finding on main informs without blocking.
        if: github.event_name == 'push'
        run: make fuzz

      - name: lint specs
        run: ./bin/spectackle lint .

      - name: smoke
        run: make smoke

      # Self-hosting gate: drive the MCP server headlessly (no ./bin/spectackle
      # serve needed as a separate step — the driver below spawns and talks to
      # it over stdio) and require a clean `check`. Driver shape mirrors the
      # README "Headless quickstart" Python driver; see that section for the
      # handshake protocol this heredoc implements.
      - name: check (self-hosting gate)
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys

          proc = subprocess.Popen(["./bin/spectackle", "serve", "-root", "."],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL, text=True, bufsize=1)
          send = lambda o: (proc.stdin.write(json.dumps(o) + "\n"), proc.stdin.flush())
          def recv():
              while True:
                  line = proc.stdout.readline()
                  if not line: return None
                  try: return json.loads(line)
                  except json.JSONDecodeError: continue

          send({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                "params": {"protocolVersion": "2025-06-18", "capabilities": {},
                           "clientInfo": {"name": "ci-gate", "version": "0"}}})
          recv()
          send({"jsonrpc": "2.0", "method": "notifications/initialized"})
          send({"jsonrpc": "2.0", "id": 100, "method": "tools/call",
                "params": {"name": "check", "arguments": {}}})
          r = recv()
          text = "".join(c["text"] for c in r.get("result", {}).get("content", [])
                          if c.get("type") == "text")
          lines = [l for l in text.splitlines() if not l.startswith("sw ")]
          result = "\n".join(lines).strip()
          proc.terminate()
          if result != "ok":
              print(result, file=sys.stderr)
              sys.exit(1)
          print("ok")
          EOF
