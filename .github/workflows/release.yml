name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The secrets context is NOT available in a step-level `if`, only in
    # `env:` and `with:`, so the App-configured probe below reads this
    # job-level env var instead of the secret directly.
    env:
      TAP_APP_ID: ${{ secrets.TAP_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test -race ./...

      # Pushing the cask to jxsl13/homebrew-tap needs a token scoped to THAT
      # repository; the built-in GITHUB_TOKEN only ever covers this one and
      # cannot be widened. Preferred path: a GitHub App installed on the tap
      # repository mints an installation token here, valid one hour and
      # revoked when the job ends, so nothing long-lived is stored — only the
      # App id and its private key, which cannot push anything by themselves.
      # Skipped cleanly when the App is not configured; the step below then
      # falls back to a classic/fine-grained PAT secret, and if neither
      # exists the release still succeeds without updating the tap.
      - name: mint tap token
        id: tap_token
        if: ${{ env.TAP_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pinned, not `latest`: .goreleaser.yaml uses the deprecated
          # `brews` block (the only way to reach Linux via Homebrew — see the
          # comment there). Tracking `latest` would turn its eventual removal
          # upstream into a broken release with no change of ours. Bump this
          # deliberately, after re-running `make release-snapshot`.
          version: "~> v2.17"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap_token.outputs.token || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
